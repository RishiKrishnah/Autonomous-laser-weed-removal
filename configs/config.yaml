camera:
  source: 0
  width: 640
  height: 480
  fps: 30

model:
  confidence: 0.55
  iou: 0.45
  imgsz: 640
  target_mode: bbox_center

tracking:
  enabled: true
  required_stable_frames: 3
  max_center_jump_px: 60
  target_timeout_s: 1.0

safety:
  require_stable_target: true
  minimum_confidence: 0.55
  crop_exclusion_px: 45
  require_stationary: true
  interlock_closed: false
  emergency_stop: false

hardware:
  mode: simulation
  treatment_enabled: false
  serial_port: COM3
  baudrate: 115200
  pan_min_deg: 20
  pan_max_deg: 160
  tilt_min_deg: 20
  tilt_max_deg: 120
  pan_center_deg: 90
  tilt_center_deg: 70

calibration:
  # Approximate empirical mapping for an initial tabletop prototype.
  # Replace these values after calibration.
  camera_width_px: 640
  camera_height_px: 480
  pan_center_deg: 90
  tilt_center_deg: 70
  pan_deg_per_px: 0.10
  tilt_deg_per_px: 0.10

logging:
  directory: logs
