camera:
  source: 0
  width: 640
  height: 480
  fps: 30

model:
  confidence: 0.55
  iou: 0.45
  imgsz: 640
  target_mode: bbox_center

tracking:
  enabled: true
  required_stable_frames: 5
  max_center_jump_px: 60
  target_timeout_s: 1.0

crop_exclusion:
  enabled: true

  # Polygon points are image coordinates.
  #
  # Example:
  # zones:
  #   - name: crop_zone_1
  #     points:
  #       - [0, 0]
  #       - [200, 0]
  #       - [200, 150]
  #       - [0, 150]
  #
  # Empty zones mean that no crop exclusion polygon has been
  # calibrated yet.
  zones: []

safety:
  require_stable_target: true
  minimum_confidence: 0.55
  require_stationary: true

  # Runtime software safety.
  emergency_stop: false
  interlock_closed: true

  # Must remain false for the submitted reference implementation.
  treatment_enabled: true

hardware:
  mode: serial

  # Serial configuration is retained for safe indicator hardware.
  # First one that exists is used.
  serial_port:
    - /dev/cu.usbmodem1201
    - /dev/cu.usbmodem11201
    - /dev/cu.usbmodem*
  baudrate: 115200

  pan_min_deg: 20
  pan_max_deg: 160

  tilt_min_deg: 20
  tilt_max_deg: 120

  pan_center_deg: 90
  tilt_center_deg: 70

calibration:
  camera_width_px: 640
  camera_height_px: 480

  pan_center_deg: 90
  tilt_center_deg: 70

  # Fitted pixel -> servo mapping written by scripts/calibrate_servos.py.
  # When this file exists it replaces the linear estimate below.
  file: configs/servo_calibration.json

  # Linear fallback, only used without the fitted file.
  pan_deg_per_px: 0.10
  tilt_deg_per_px: 0.10

verification:
  enabled: true
  verification_frames: 5
  confidence_drop_threshold: 0.15

logging:
  directory: logs
